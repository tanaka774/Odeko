<!-- Meteor Defense -->
<!doctype html>
<html>
	<head>
		<style>
			html,
			body {
				margin: 0;
				height: 100%;
				overflow: hidden;
				background: transparent;
				font:
					600 14px system-ui,
					sans-serif;
				color: white;
				cursor: crosshair;
				user-select: none;
			}
			canvas {
				display: block;
				width: 100%;
				height: 100%;
			}
			.hud {
				position: absolute;
				top: 16px;
				left: 50%;
				transform: translateX(-50%);
				display: flex;
				gap: 24px;
				padding: 6px 16px;
				border-radius: 999px;
				background: rgba(0, 0, 0, 0.35);
				pointer-events: none;
			}
			.banner {
				position: absolute;
				inset: 0;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 8px;
				text-align: center;
				pointer-events: none;
			}
			.banner h1 {
				margin: 0;
				font-size: 32px;
			}
			.banner p {
				margin: 0;
				opacity: 0.7;
			}
			.hidden {
				display: none;
			}
		</style>
	</head>
	<body>
		<canvas></canvas>
		<div class="hud">
			<span id="score">Score 0</span>
			<span id="shields">Shields ●●●</span>
		</div>
		<div class="banner" id="banner">
			<h1>Meteor Defense</h1>
			<p>Meteors aim at your icons. Click empty space to blast them.</p>
			<p>Click to start</p>
		</div>
		<script>
			// Meteors fall toward the icons; clicking the canvas sets off a blast
			// that destroys meteors inside it. Three hits and the round is over.
			const canvas = document.querySelector('canvas');
			const ctx = canvas.getContext('2d');
			const banner = document.getElementById('banner');
			const scoreEl = document.getElementById('score');
			const shieldsEl = document.getElementById('shields');
			const BLAST_RADIUS = 60;

			let width = 0;
			let height = 0;
			let icons = [];
			let meteors = [];
			let blasts = [];
			let sparks = [];
			let hits = [];
			let score = 0;
			let shields = 3;
			let playing = false;
			let spawnIn = 0;
			let elapsed = 0;
			let last = 0;

			function resize(state) {
				const ratio = window.devicePixelRatio || 1;
				if (state.width === width && state.height === height) return;
				width = state.width;
				height = state.height;
				canvas.width = width * ratio;
				canvas.height = height * ratio;
				ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
			}

			function start() {
				meteors = [];
				score = 0;
				shields = 3;
				elapsed = 0;
				spawnIn = 1;
				playing = true;
				banner.classList.add('hidden');
				updateHud();
			}

			function updateHud() {
				scoreEl.textContent = `Score ${score}`;
				shieldsEl.textContent = `Shields ${'●'.repeat(shields)}${'○'.repeat(3 - shields)}`;
			}

			function spawn() {
				const target = icons.length
					? icons[Math.floor(Math.random() * icons.length)]
					: { x: Math.random() * width, y: height, width: 0, height: 0 };
				const tx = target.x + target.width / 2;
				const ty = target.y + target.height / 2;
				const x = Math.random() * width;
				const y = -20;
				const speed = 60 + Math.random() * 40 + elapsed * 1.5;
				const length = Math.hypot(tx - x, ty - y);
				meteors.push({
					x,
					y,
					vx: ((tx - x) / length) * speed,
					vy: ((ty - y) / length) * speed,
					r: 6 + Math.random() * 6
				});
			}

			function burst(x, y, color, count) {
				for (let i = 0; i < count; i++) {
					const angle = Math.random() * Math.PI * 2;
					const speed = 40 + Math.random() * 160;
					sparks.push({
						x,
						y,
						vx: Math.cos(angle) * speed,
						vy: Math.sin(angle) * speed,
						life: 0.6 + Math.random() * 0.4,
						color
					});
				}
			}

			function iconHit(meteor) {
				return icons.find(
					(icon) =>
						meteor.x > icon.x &&
						meteor.x < icon.x + icon.width &&
						meteor.y > icon.y &&
						meteor.y < icon.y + icon.height
				);
			}

			window.addEventListener('pointerdown', (event) => {
				if (event.button !== 0) return;
				if (!playing) {
					start();
					return;
				}
				blasts.push({ x: event.clientX, y: event.clientY, age: 0 });
			});

			odeko.on('frame', (state) => {
				const dt = Math.min(0.05, state.time - last);
				last = state.time;
				resize(state);
				icons = state.icons;

				if (playing) {
					elapsed += dt;
					spawnIn -= dt;
					if (spawnIn <= 0) {
						spawn();
						spawnIn = Math.max(0.35, 1.6 - elapsed * 0.02);
					}
				}

				for (const blast of blasts) {
					blast.age += dt;
					const radius = BLAST_RADIUS * Math.min(1, blast.age * 6);
					meteors = meteors.filter((m) => {
						if (Math.hypot(m.x - blast.x, m.y - blast.y) > radius + m.r) return true;
						score += 10;
						burst(m.x, m.y, '255, 190, 90', 18);
						return false;
					});
				}
				blasts = blasts.filter((blast) => blast.age < 0.5);

				meteors = meteors.filter((m) => {
					m.x += m.vx * dt;
					m.y += m.vy * dt;
					const icon = iconHit(m);
					if (icon || m.y > height + 20) {
						if (icon) {
							if (playing) shields -= 1;
							hits.push({ ...icon, age: 0 });
							burst(m.x, m.y, '255, 90, 90', 30);
						}
						return false;
					}
					return true;
				});
				if (playing && shields <= 0) {
					playing = false;
					banner.innerHTML = `<h1>Game over</h1><p>Score ${score}</p><p>Click to play again</p>`;
					banner.classList.remove('hidden');
				}
				updateHud();

				for (const spark of sparks) {
					spark.x += spark.vx * dt;
					spark.y += spark.vy * dt;
					spark.vy += 120 * dt;
					spark.life -= dt;
				}
				sparks = sparks.filter((spark) => spark.life > 0);
				for (const hit of hits) hit.age += dt;
				hits = hits.filter((hit) => hit.age < 0.6);

				ctx.clearRect(0, 0, width, height);
				for (const m of meteors) {
					const tail = ctx.createLinearGradient(m.x, m.y, m.x - m.vx * 0.4, m.y - m.vy * 0.4);
					tail.addColorStop(0, 'rgba(255, 160, 80, 0.8)');
					tail.addColorStop(1, 'rgba(255, 160, 80, 0)');
					ctx.strokeStyle = tail;
					ctx.lineWidth = m.r;
					ctx.lineCap = 'round';
					ctx.beginPath();
					ctx.moveTo(m.x, m.y);
					ctx.lineTo(m.x - m.vx * 0.4, m.y - m.vy * 0.4);
					ctx.stroke();
					ctx.fillStyle = '#ffd9a0';
					ctx.beginPath();
					ctx.arc(m.x, m.y, m.r * 0.7, 0, Math.PI * 2);
					ctx.fill();
				}
				for (const blast of blasts) {
					const t = blast.age / 0.5;
					ctx.strokeStyle = `rgba(150, 200, 255, ${1 - t})`;
					ctx.lineWidth = 3;
					ctx.beginPath();
					ctx.arc(blast.x, blast.y, BLAST_RADIUS * Math.min(1, blast.age * 6), 0, Math.PI * 2);
					ctx.stroke();
				}
				for (const hit of hits) {
					const grow = hit.age * 30;
					ctx.strokeStyle = `rgba(255, 80, 80, ${1 - hit.age / 0.6})`;
					ctx.lineWidth = 4;
					ctx.strokeRect(hit.x - grow, hit.y - grow, hit.width + grow * 2, hit.height + grow * 2);
				}
				for (const spark of sparks) {
					ctx.fillStyle = `rgba(${spark.color}, ${spark.life})`;
					ctx.fillRect(spark.x - 1.5, spark.y - 1.5, 3, 3);
				}
			});
		</script>
	</body>
</html>
