<!-- Three.js Crystals -->
<!doctype html>
<html>
	<head>
		<style>
			html,
			body {
				margin: 0;
				height: 100%;
				overflow: hidden;
				background: transparent;
			}
		</style>
		<script type="importmap">
			{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
		</script>
	</head>
	<body>
		<script type="module">
			// Floating crystals rendered with Three.js (downloaded once, then
			// cached). The camera follows the pointer and clicks spin the
			// crystals near them.
			import * as THREE from 'three';

			const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
			renderer.setPixelRatio(window.devicePixelRatio);
			document.body.appendChild(renderer.domElement);

			const scene = new THREE.Scene();
			const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
			camera.position.z = 14;
			scene.add(new THREE.AmbientLight(0x8090ff, 0.6));
			const light = new THREE.PointLight(0xffd0a0, 300);
			light.position.set(4, 6, 8);
			scene.add(light);

			const geometry = new THREE.IcosahedronGeometry(1, 0);
			const crystals = [];
			for (let i = 0; i < 28; i++) {
				const material = new THREE.MeshStandardMaterial({
					color: new THREE.Color().setHSL(0.55 + Math.random() * 0.25, 0.6, 0.55),
					flatShading: true,
					roughness: 0.3,
					metalness: 0.2
				});
				const mesh = new THREE.Mesh(geometry, material);
				mesh.position.set(
					(Math.random() - 0.5) * 22,
					(Math.random() - 0.5) * 12,
					(Math.random() - 0.5) * 8
				);
				mesh.scale.setScalar(0.3 + Math.random() * 0.8);
				mesh.userData = { spin: 0.2 + Math.random() * 0.5, kick: 0, phase: Math.random() * 6 };
				scene.add(mesh);
				crystals.push(mesh);
			}

			const projected = new THREE.Vector3();
			let newestClickAge = Infinity;
			let width = 0;
			let height = 0;
			let last = 0;

			odeko.on('frame', (state) => {
				const dt = Math.min(0.05, state.time - last);
				last = state.time;
				if (state.width !== width || state.height !== height) {
					width = state.width;
					height = state.height;
					renderer.setSize(width, height);
					camera.aspect = width / height;
					camera.updateProjectionMatrix();
				}

				const px = (state.pointer.x / width - 0.5) * state.pointer.presence;
				const py = (state.pointer.y / height - 0.5) * state.pointer.presence;
				camera.position.x += (px * 6 - camera.position.x) * dt * 2;
				camera.position.y += (-py * 4 - camera.position.y) * dt * 2;
				camera.lookAt(0, 0, 0);

				const click = state.clicks[0];
				const clicked = click && click.age < newestClickAge;
				newestClickAge = click ? click.age : Infinity;

				for (const mesh of crystals) {
					const data = mesh.userData;
					if (clicked) {
						projected.copy(mesh.position).project(camera);
						const sx = (projected.x * 0.5 + 0.5) * width;
						const sy = (-projected.y * 0.5 + 0.5) * height;
						if (Math.hypot(sx - click.x, sy - click.y) < 200) data.kick = 8;
					}
					data.kick *= 1 - dt * 2;
					mesh.rotation.x += (data.spin + data.kick) * dt;
					mesh.rotation.y += (data.spin * 0.7 + data.kick) * dt;
					mesh.position.y += Math.sin(state.time * 0.5 + data.phase) * dt * 0.3;
				}
				renderer.render(scene, camera);
			});
		</script>
	</body>
</html>
