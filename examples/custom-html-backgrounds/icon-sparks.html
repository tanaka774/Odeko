<!-- Icon Sparks (set Placement to "Over icons") -->
<!doctype html>
<html>
	<head>
		<style>
			html,
			body {
				margin: 0;
				height: 100%;
				overflow: hidden;
				background: transparent;
			}
			canvas {
				display: block;
				width: 100%;
				height: 100%;
			}
		</style>
	</head>
	<body>
		<canvas></canvas>
		<script>
			// Draws over the icons: an outline traces the hovered icon and every
			// click anywhere bursts into sparks.
			const canvas = document.querySelector('canvas');
			const ctx = canvas.getContext('2d');
			const sparks = [];
			let newestClickAge = Infinity;
			let last = 0;

			function burst(x, y) {
				for (let i = 0; i < 40; i++) {
					const angle = Math.random() * Math.PI * 2;
					const speed = 80 + Math.random() * 260;
					sparks.push({
						x,
						y,
						vx: Math.cos(angle) * speed,
						vy: Math.sin(angle) * speed,
						life: 0.6 + Math.random() * 0.6,
						hue: 30 + Math.random() * 40
					});
				}
			}

			odeko.on('frame', (state) => {
				const dt = Math.min(0.05, state.time - last);
				last = state.time;
				const ratio = window.devicePixelRatio || 1;
				if (canvas.width !== Math.round(state.width * ratio)) {
					canvas.width = Math.round(state.width * ratio);
					canvas.height = Math.round(state.height * ratio);
				}
				ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
				ctx.clearRect(0, 0, state.width, state.height);

				// A click is new when the newest one got younger since last frame.
				const newest = state.clicks[0];
				if (newest && newest.age < newestClickAge) burst(newest.x, newest.y);
				newestClickAge = newest ? newest.age : Infinity;

				const hover = state.hover;
				if (hover.amount > 0.01) {
					const grow = 4 + (1 - hover.amount) * 10;
					ctx.strokeStyle = `rgba(255, 210, 120, ${hover.amount * 0.9})`;
					ctx.lineWidth = 2;
					ctx.setLineDash([8, 6]);
					ctx.lineDashOffset = -state.time * 30;
					ctx.beginPath();
					ctx.roundRect(
						hover.x - grow,
						hover.y - grow,
						hover.width + grow * 2,
						hover.height + grow * 2,
						14
					);
					ctx.stroke();
					ctx.setLineDash([]);
				}

				ctx.globalCompositeOperation = 'lighter';
				for (let i = sparks.length - 1; i >= 0; i--) {
					const s = sparks[i];
					s.life -= dt;
					if (s.life <= 0) {
						sparks.splice(i, 1);
						continue;
					}
					s.vy += 400 * dt;
					s.vx *= 1 - dt * 1.5;
					s.x += s.vx * dt;
					s.y += s.vy * dt;
					ctx.fillStyle = `hsla(${s.hue}, 100%, 65%, ${Math.min(1, s.life * 2)})`;
					ctx.fillRect(s.x - 1.5, s.y - 1.5, 3, 3);
				}
				ctx.globalCompositeOperation = 'source-over';
			});
		</script>
	</body>
</html>
