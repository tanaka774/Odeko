<!-- Snow (set Placement to "Over icons") -->
<!doctype html>
<html>
	<head>
		<style>
			html,
			body {
				margin: 0;
				height: 100%;
				overflow: hidden;
				background: transparent;
			}
			canvas {
				display: block;
				width: 100%;
				height: 100%;
			}
		</style>
	</head>
	<body>
		<canvas></canvas>
		<script>
			// Snow falling over the icons. The pointer blows flakes away and
			// flakes that land on an icon's top edge rest there and melt.
			const canvas = document.querySelector('canvas');
			const ctx = canvas.getContext('2d');
			const flakes = [];
			let width = 0;
			let height = 0;

			function spawn(atTop) {
				return {
					x: Math.random() * width,
					y: atTop ? -10 : Math.random() * height,
					r: 1 + Math.random() * 2.5,
					vx: 0,
					vy: 20 + Math.random() * 30,
					sway: Math.random() * Math.PI * 2,
					rest: 0
				};
			}

			function resize(state) {
				const ratio = window.devicePixelRatio || 1;
				if (state.width === width && state.height === height) return;
				width = state.width;
				height = state.height;
				canvas.width = width * ratio;
				canvas.height = height * ratio;
				ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
				const target = Math.round((width * height) / 6000);
				while (flakes.length < target) flakes.push(spawn(false));
				flakes.length = target;
			}

			function landedOn(flake, icons) {
				for (const icon of icons) {
					if (
						flake.x > icon.x + 4 &&
						flake.x < icon.x + icon.width - 4 &&
						flake.y > icon.y - 2 &&
						flake.y < icon.y + 4
					) {
						return icon;
					}
				}
				return null;
			}

			let last = 0;
			odeko.on('frame', (state) => {
				const dt = Math.min(0.05, state.time - last);
				last = state.time;
				resize(state);
				ctx.clearRect(0, 0, width, height);
				ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
				const { pointer, velocity } = state;

				for (let i = 0; i < flakes.length; i++) {
					const f = flakes[i];
					if (f.rest > 0) {
						f.rest -= dt;
						if (f.rest <= 0) flakes[i] = spawn(true);
					} else {
						const dx = f.x - pointer.x;
						const dy = f.y - pointer.y;
						const near = Math.max(0, 1 - Math.hypot(dx, dy) / 90) * pointer.presence;
						f.vx += (velocity.x * near * 0.08 - f.vx) * dt * 2;
						f.sway += dt;
						f.x += (f.vx + Math.sin(f.sway) * 12) * dt;
						f.y += (f.vy + velocity.y * near * 0.05) * dt;
						if (landedOn(f, state.icons)) f.rest = 2 + Math.random() * 4;
						if (f.y > height + 10 || f.x < -20 || f.x > width + 20) flakes[i] = spawn(true);
					}
					ctx.globalAlpha = f.rest > 0 ? Math.min(1, f.rest) : 1;
					ctx.beginPath();
					ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
					ctx.fill();
				}
				ctx.globalAlpha = 1;
			});
		</script>
	</body>
</html>
