<!--
	2048: arrow keys or swipe. The board and best score are saved with
	odeko.storage, so a game survives restarts.
-->
<style>
	:root {
		--board: rgba(255, 255, 255, 0.08);
		--empty: rgba(255, 255, 255, 0.06);
	}
	* {
		box-sizing: border-box;
	}
	body {
		display: flex;
		flex-direction: column;
		height: 100vh;
		padding: 8px;
		gap: 6px;
		user-select: none;
		outline: none;
	}
	header {
		display: flex;
		align-items: center;
		gap: 8px;
	}
	.score {
		background: var(--board);
		border-radius: 6px;
		padding: 2px 8px;
		font-size: 0.8em;
		font-variant-numeric: tabular-nums;
	}
	.score b {
		font-size: 1.15em;
	}
	#new {
		margin-left: auto;
		font: inherit;
		font-size: 0.8em;
		padding: 3px 10px;
		border-radius: 6px;
		border: none;
		background: #f59e0b;
		color: #1c1917;
		font-weight: 700;
		cursor: pointer;
	}
	#board {
		flex: 1;
		min-height: 0;
		aspect-ratio: 1;
		max-width: 100%;
		margin: 0 auto;
		display: grid;
		grid-template-columns: repeat(4, 1fr);
		gap: 6px;
		padding: 6px;
		background: var(--board);
		border-radius: 10px;
	}
	.tile {
		display: grid;
		place-items: center;
		border-radius: 6px;
		background: var(--empty);
		font-weight: 800;
		font-size: clamp(0.9em, 9vmin, 2.4em);
		transition: background 0.1s;
	}
	#over {
		text-align: center;
		font-weight: 700;
		min-height: 1.2em;
	}
</style>
<header>
	<div class="score">Score <b id="score">0</b></div>
	<div class="score">Best <b id="best">0</b></div>
	<button id="new">New</button>
</header>
<div id="board" tabindex="0"></div>
<div id="over"></div>
<script>
	const COLORS = {
		2: '#eee4da',
		4: '#ede0c8',
		8: '#f2b179',
		16: '#f59563',
		32: '#f67c5f',
		64: '#f65e3b',
		128: '#edcf72',
		256: '#edcc61',
		512: '#edc850',
		1024: '#edc53f',
		2048: '#edc22e'
	};
	let cells,
		score,
		best = 0;

	function spawn() {
		const empty = cells.map((v, i) => (v ? -1 : i)).filter((i) => i >= 0);
		if (empty.length)
			cells[empty[Math.floor(Math.random() * empty.length)]] = Math.random() < 0.9 ? 2 : 4;
	}

	function reset() {
		cells = Array(16).fill(0);
		score = 0;
		spawn();
		spawn();
		save();
		render();
	}

	function save() {
		best = Math.max(best, score);
		odeko.storage.set('game', { cells, score, best });
	}

	function render() {
		document.getElementById('board').replaceChildren(
			...cells.map((v) => {
				const tile = document.createElement('div');
				tile.className = 'tile';
				if (v) {
					tile.textContent = v;
					tile.style.background = COLORS[v] ?? '#3c3a32';
					tile.style.color = v <= 4 ? '#776e65' : '#f9f6f2';
				}
				return tile;
			})
		);
		document.getElementById('score').textContent = score;
		document.getElementById('best').textContent = Math.max(best, score);
		document.getElementById('over').textContent = canMove()
			? cells.includes(2048)
				? 'You made 2048! 🎉'
				: ''
			: 'Game over';
	}

	function line(index, dir) {
		const out = [];
		for (let k = 0; k < 4; k++) {
			out.push(
				dir === 'left'
					? index * 4 + k
					: dir === 'right'
						? index * 4 + 3 - k
						: dir === 'up'
							? k * 4 + index
							: (3 - k) * 4 + index
			);
		}
		return out;
	}

	function move(dir) {
		let moved = false;
		for (let i = 0; i < 4; i++) {
			const idx = line(i, dir);
			const values = idx.map((j) => cells[j]).filter(Boolean);
			const merged = [];
			while (values.length) {
				const v = values.shift();
				if (values[0] === v) {
					merged.push(v * 2);
					score += v * 2;
					values.shift();
				} else merged.push(v);
			}
			idx.forEach((j, k) => {
				const next = merged[k] ?? 0;
				if (cells[j] !== next) moved = true;
				cells[j] = next;
			});
		}
		if (moved) {
			spawn();
			save();
			render();
		}
	}

	function canMove() {
		if (cells.includes(0)) return true;
		for (let i = 0; i < 16; i++) {
			if (i % 4 < 3 && cells[i] === cells[i + 1]) return true;
			if (i < 12 && cells[i] === cells[i + 4]) return true;
		}
		return false;
	}

	const KEYS = {
		ArrowLeft: 'left',
		ArrowRight: 'right',
		ArrowUp: 'up',
		ArrowDown: 'down',
		a: 'left',
		d: 'right',
		w: 'up',
		s: 'down'
	};
	window.addEventListener('keydown', (event) => {
		const dir = KEYS[event.key];
		if (!dir) return;
		event.preventDefault();
		move(dir);
	});
	let start = null;
	window.addEventListener('pointerdown', (e) => {
		start = [e.clientX, e.clientY];
		document.getElementById('board').focus();
	});
	window.addEventListener('pointerup', (e) => {
		if (!start) return;
		const dx = e.clientX - start[0];
		const dy = e.clientY - start[1];
		start = null;
		if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
		move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : dy > 0 ? 'down' : 'up');
	});
	document.getElementById('new').addEventListener('click', reset);

	odeko.storage.get('game').then((saved) => {
		if (saved?.cells?.length === 16) {
			({ cells, score, best } = saved);
			render();
		} else reset();
	});
</script>
