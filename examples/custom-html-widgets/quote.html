<!--
	Quote of the day: a new quote each day from the built-in list, the same
	one all day. Click for another. Add your own to QUOTES.
-->
<style>
	:root {
		--accent: #c4b5fd;
		--font: Georgia, 'Times New Roman', serif;
	}
	* {
		box-sizing: border-box;
	}
	body {
		display: flex;
		flex-direction: column;
		justify-content: center;
		height: 100vh;
		padding: 14px 18px;
		font-family: var(--font);
		cursor: pointer;
		user-select: none;
	}
	#text {
		font-size: 1.25em;
		line-height: 1.45;
		font-style: italic;
	}
	#text::before {
		content: '“';
		color: var(--accent);
		font-size: 1.6em;
		line-height: 0;
		vertical-align: -0.35em;
		margin-right: 2px;
	}
	#author {
		margin-top: 10px;
		text-align: right;
		opacity: 0.65;
		font-size: 0.9em;
	}
	#author::before {
		content: '— ';
	}
	.fade {
		animation: fade 0.5s ease;
	}
	@keyframes fade {
		from {
			opacity: 0;
			transform: translateY(4px);
		}
	}
</style>
<div id="quote">
	<div id="text"></div>
	<div id="author"></div>
</div>
<script>
	const QUOTES = [
		[
			'The best time to plant a tree was 20 years ago. The second best time is now.',
			'Chinese proverb'
		],
		['Simplicity is the ultimate sophistication.', 'Leonardo da Vinci'],
		['What we do every day matters more than what we do once in a while.', 'Gretchen Rubin'],
		['Fall seven times, stand up eight.', 'Japanese proverb'],
		['The secret of getting ahead is getting started.', 'Mark Twain'],
		['Make it work, make it right, make it fast.', 'Kent Beck'],
		['Nature does not hurry, yet everything is accomplished.', 'Lao Tzu'],
		['We are what we repeatedly do.', 'Will Durant'],
		['Done is better than perfect.', 'Sheryl Sandberg'],
		['The obstacle is the way.', 'Marcus Aurelius'],
		['Stay hungry, stay foolish.', 'Stewart Brand'],
		['A journey of a thousand miles begins with a single step.', 'Lao Tzu'],
		['Perfection is achieved when there is nothing left to take away.', 'Antoine de Saint-Exupéry'],
		['Creativity is intelligence having fun.', 'Albert Einstein'],
		['Even monkeys fall from trees.', 'Japanese proverb'],
		['You miss 100% of the shots you don’t take.', 'Wayne Gretzky'],
		['Slow is smooth, and smooth is fast.', 'Navy SEAL saying'],
		['Talk is cheap. Show me the code.', 'Linus Torvalds'],
		['If you want to go fast, go alone. If you want to go far, go together.', 'African proverb'],
		['The cure for boredom is curiosity. There is no cure for curiosity.', 'Dorothy Parker']
	];
	const box = document.getElementById('quote');

	function dayIndex() {
		const now = new Date();
		return Math.floor(new Date(now.getFullYear(), now.getMonth(), now.getDate()) / 86400000);
	}

	let index = dayIndex() % QUOTES.length;

	function show() {
		const [text, author] = QUOTES[index];
		document.getElementById('text').textContent = text;
		document.getElementById('author').textContent = author;
		box.classList.remove('fade');
		void box.offsetWidth;
		box.classList.add('fade');
	}

	document.body.addEventListener('click', () => {
		index = (index + 1) % QUOTES.length;
		show();
	});

	show();
</script>
