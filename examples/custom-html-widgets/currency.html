<!--
	Currency rates: one base currency against a few others (Frankfurter,
	European Central Bank rates, no key). Refreshes hourly.
	Change BASE and SYMBOLS below.
-->
<style>
	* {
		box-sizing: border-box;
	}
	body {
		padding: 8px 12px;
	}
	h3 {
		margin: 0 0 4px;
		font-size: 0.75em;
		text-transform: uppercase;
		letter-spacing: 0.06em;
		opacity: 0.55;
	}
	.row {
		display: flex;
		justify-content: space-between;
		align-items: baseline;
		padding: 5px 0;
		border-bottom: 1px solid rgba(255, 255, 255, 0.06);
	}
	.row:last-child {
		border-bottom: none;
	}
	.code {
		font-weight: 600;
	}
	.rate {
		font-weight: 700;
		font-variant-numeric: tabular-nums;
	}
	#updated {
		font-size: 0.7em;
		opacity: 0.5;
		text-align: right;
		margin-top: 2px;
	}
	#err {
		color: #fca5a5;
		font-size: 0.8em;
	}
</style>
<h3 id="title"></h3>
<div id="list">Loading…</div>
<div id="err"></div>
<div id="updated"></div>
<script>
	const BASE = 'JPY';
	const AMOUNT = 1000;
	const SYMBOLS = ['USD', 'EUR', 'GBP', 'KRW', 'CNY'];
	document.getElementById('title').textContent = `${AMOUNT.toLocaleString()} ${BASE}`;

	async function load() {
		const err = document.getElementById('err');
		err.textContent = '';
		try {
			const url = `https://api.frankfurter.app/latest?amount=${AMOUNT}&from=${BASE}&to=${SYMBOLS.join(',')}`;
			const { status, body } = await odeko.fetch(url);
			if (status !== 200) throw new Error(`HTTP ${status}`);
			const data = JSON.parse(body);
			document.getElementById('list').replaceChildren(
				...SYMBOLS.filter((code) => data.rates[code] != null).map((code) => {
					const row = document.createElement('div');
					row.className = 'row';
					const value = data.rates[code];
					row.innerHTML = `<span class="code">${code}</span><span class="rate"></span>`;
					row.querySelector('.rate').textContent = value.toLocaleString(undefined, {
						maximumFractionDigits: value >= 100 ? 0 : 2
					});
					return row;
				})
			);
			document.getElementById('updated').textContent = `ECB rates of ${data.date}`;
		} catch (error) {
			err.textContent = String(error.message ?? error);
		}
	}

	load();
	setInterval(load, 3600000);
</script>
