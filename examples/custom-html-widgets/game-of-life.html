<style>
	body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
	canvas { flex: 1; min-height: 0; width: 100%; cursor: crosshair; }
	.controls { display: flex; gap: 4px; justify-content: center; align-items: center; padding: 4px; }
	button { font: inherit; font-size: 0.8em; padding: 3px 8px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.25); background: rgba(255, 255, 255, 0.08); color: inherit; cursor: pointer; }
	#gen { font-size: 0.75em; opacity: 0.6; }
</style>
<canvas id="c"></canvas>
<div class="controls">
	<button id="run">Start/Stop</button>
	<button id="rand">Random</button>
	<button id="clear">Clear</button>
	<span id="gen">gen 0</span>
</div>
<script>
	// The board is saved whenever you change it or stop the run, so your
	// pattern survives restarts. Click cells to toggle them.
	const CELL = 6;
	const canvas = document.getElementById('c');
	const ctx = canvas.getContext('2d');
	let cols = 0;
	let rows = 0;
	let grid = [];
	let timer = null;
	let gen = 0;

	const blank = () => Array.from({ length: rows }, () => Array(cols).fill(0));
	const setGen = (n) => {
		gen = n;
		document.getElementById('gen').textContent = `gen ${gen}`;
	};
	const save = () => odeko.storage.set('board', { cols, rows, cells: grid.map((row) => row.join('')) });

	function fit(saved) {
		canvas.width = canvas.clientWidth;
		canvas.height = canvas.clientHeight;
		cols = Math.max(1, Math.floor(canvas.width / CELL));
		rows = Math.max(1, Math.floor(canvas.height / CELL));
		const old = grid;
		grid = blank();
		const source = saved ? saved.cells.map((row) => [...row].map(Number)) : old;
		for (let y = 0; y < Math.min(rows, source.length); y++) {
			for (let x = 0; x < Math.min(cols, source[y].length); x++) grid[y][x] = source[y][x];
		}
		draw();
	}

	function neighbors(x, y) {
		let n = 0;
		for (let dy = -1; dy <= 1; dy++) {
			for (let dx = -1; dx <= 1; dx++) {
				if (dx || dy) n += grid[(y + dy + rows) % rows][(x + dx + cols) % cols];
			}
		}
		return n;
	}

	function step() {
		grid = grid.map((row, y) =>
			row.map((cell, x) => {
				const n = neighbors(x, y);
				return cell ? (n === 2 || n === 3 ? 1 : 0) : n === 3 ? 1 : 0;
			})
		);
		setGen(gen + 1);
		draw();
	}

	function draw() {
		ctx.clearRect(0, 0, canvas.width, canvas.height);
		ctx.fillStyle = '#4ade80';
		for (let y = 0; y < rows; y++) {
			for (let x = 0; x < cols; x++) {
				if (grid[y][x]) ctx.fillRect(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2);
			}
		}
	}

	function stop() {
		if (!timer) return;
		clearInterval(timer);
		timer = null;
		save();
	}

	document.getElementById('run').addEventListener('click', () => {
		if (timer) stop();
		else timer = setInterval(step, 120);
	});
	document.getElementById('rand').addEventListener('click', () => {
		stop();
		grid = grid.map((row) => row.map(() => (Math.random() < 0.28 ? 1 : 0)));
		setGen(0);
		draw();
		save();
	});
	document.getElementById('clear').addEventListener('click', () => {
		stop();
		grid = blank();
		setGen(0);
		draw();
		save();
	});
	canvas.addEventListener('click', (event) => {
		const rect = canvas.getBoundingClientRect();
		const x = Math.floor((event.clientX - rect.left) / CELL);
		const y = Math.floor((event.clientY - rect.top) / CELL);
		if (grid[y] && x < cols) {
			grid[y][x] = grid[y][x] ? 0 : 1;
			draw();
			save();
		}
	});
	window.addEventListener('resize', () => fit());

	odeko.storage.get('board').then((saved) => {
		fit(saved);
		if (!saved) {
			const cy = Math.floor(rows / 2);
			const cx = Math.floor(cols / 2);
			for (const [dy, dx] of [[0, 1], [1, 2], [2, 0], [2, 1], [2, 2]]) grid[cy + dy][cx + dx] = 1;
			draw();
		}
	});
</script>
