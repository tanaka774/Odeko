<style>
	body { padding: 8px 12px; }
	.row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
	.row:last-child { border-bottom: none; }
	.city { opacity: 0.65; }
	.time { font-weight: 600; font-variant-numeric: tabular-nums; }
</style>
<div id="rows"></div>
<script>
	const ZONES = [
		['Tokyo', 'Asia/Tokyo'],
		['London', 'Europe/London'],
		['New York', 'America/New_York']
	];
	const rows = ZONES.map(([city, zone]) => {
		const row = document.createElement('div');
		row.className = 'row';
		row.innerHTML = `<span class="city">${city}</span><span class="time"></span>`;
		document.getElementById('rows').append(row);
		return { zone, el: row.querySelector('.time') };
	});
	function render() {
		for (const { zone, el } of rows) {
			el.textContent = new Date().toLocaleTimeString('en-GB', {
				hour: '2-digit',
				minute: '2-digit',
				second: '2-digit',
				timeZone: zone
			});
		}
	}
	setInterval(render, 1000);
	render();
</script>
