<!--
	Sun & moon: today's sunrise, sunset and day length with the sun's path,
	plus the moon phase. Calculated locally from LAT/LON, no network.
-->
<style>
	:root {
		--sun: #fbbf24;
		--sky: rgba(255, 255, 255, 0.12);
	}
	* {
		box-sizing: border-box;
	}
	body {
		display: flex;
		flex-direction: column;
		height: 100vh;
		padding: 8px 12px;
		gap: 6px;
	}
	svg {
		flex: 1;
		min-height: 0;
		width: 100%;
	}
	.times {
		display: flex;
		justify-content: space-between;
		font-variant-numeric: tabular-nums;
	}
	.times b {
		display: block;
		font-size: 1.15em;
	}
	.times span {
		font-size: 0.72em;
		opacity: 0.55;
		text-transform: uppercase;
		letter-spacing: 0.05em;
	}
	.moon {
		display: flex;
		align-items: center;
		gap: 8px;
		font-size: 0.9em;
	}
	#moonIcon {
		font-size: 1.6em;
		line-height: 1;
	}
</style>
<svg id="arc" viewBox="0 0 200 80" preserveAspectRatio="xMidYMax meet"></svg>
<div class="times">
	<div><span>Sunrise</span><b id="rise">–</b></div>
	<div style="text-align: center"><span>Daylight</span><b id="length">–</b></div>
	<div style="text-align: right"><span>Sunset</span><b id="set">–</b></div>
</div>
<div class="moon"><span id="moonIcon"></span><span id="moonText"></span></div>
<script>
	const LAT = 35.68;
	const LON = 139.69;
	const rad = Math.PI / 180;

	function sunTimes(date) {
		const day =
			Math.floor(
				(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()) - Date.UTC(2000, 0, 1, 12)) /
					86400000
			) + 0.5;
		const n = Math.round(day - 0.0009 - LON / 360);
		const meanAnomaly = (357.5291 + 0.98560028 * (n - LON / 360)) % 360;
		const center =
			1.9148 * Math.sin(meanAnomaly * rad) +
			0.02 * Math.sin(2 * meanAnomaly * rad) +
			0.0003 * Math.sin(3 * meanAnomaly * rad);
		const longitude = (meanAnomaly + center + 180 + 102.9372) % 360;
		const transit =
			2451545 +
			n -
			LON / 360 +
			0.0053 * Math.sin(meanAnomaly * rad) -
			0.0069 * Math.sin(2 * longitude * rad);
		const declination = Math.asin(Math.sin(longitude * rad) * Math.sin(23.44 * rad));
		const cosHour =
			(Math.sin(-0.833 * rad) - Math.sin(LAT * rad) * Math.sin(declination)) /
			(Math.cos(LAT * rad) * Math.cos(declination));
		if (cosHour < -1 || cosHour > 1) return null;
		const hour = Math.acos(cosHour) / rad;
		const toDate = (julian) => new Date((julian - 2440587.5) * 86400000);
		return { rise: toDate(transit - hour / 360), set: toDate(transit + hour / 360) };
	}

	function moonPhase(date) {
		const synodic = 29.53058867;
		const known = Date.UTC(2000, 0, 6, 18, 14);
		return (((((date - known) / 86400000) % synodic) + synodic) % synodic) / synodic;
	}

	const PHASES = [
		['🌑', 'New moon'],
		['🌒', 'Waxing crescent'],
		['🌓', 'First quarter'],
		['🌔', 'Waxing gibbous'],
		['🌕', 'Full moon'],
		['🌖', 'Waning gibbous'],
		['🌗', 'Last quarter'],
		['🌘', 'Waning crescent']
	];

	const fmt = (d) => d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

	function render() {
		const now = new Date();
		const times = sunTimes(now);
		const svg = document.getElementById('arc');
		let sun = '';
		if (times) {
			document.getElementById('rise').textContent = fmt(times.rise);
			document.getElementById('set').textContent = fmt(times.set);
			const minutes = Math.round((times.set - times.rise) / 60000);
			document.getElementById('length').textContent =
				`${Math.floor(minutes / 60)}h ${minutes % 60}m`;
			const t = (now - times.rise) / (times.set - times.rise);
			if (t >= 0 && t <= 1) {
				const x = 10 + 180 * t;
				const y = 75 - 65 * Math.sin(Math.PI * t);
				sun = `<circle cx="${x}" cy="${y}" r="7" fill="var(--sun)"/><circle cx="${x}" cy="${y}" r="13" fill="var(--sun)" opacity="0.25"/>`;
			}
		}
		svg.innerHTML = `<path d="M10 75 Q100 -55 190 75" fill="none" stroke="var(--sky)" stroke-width="2" stroke-dasharray="4 4"/><line x1="0" y1="75" x2="200" y2="75" stroke="var(--sky)" stroke-width="1.5"/>${sun}`;
		const phase = moonPhase(now);
		const [icon, name] = PHASES[Math.round(phase * 8) % 8];
		document.getElementById('moonIcon').textContent = icon;
		document.getElementById('moonText').textContent =
			`${name} · ${Math.round((1 - Math.cos(phase * 2 * Math.PI)) * 50)}% lit`;
	}

	render();
	setInterval(render, 60000);
</script>
