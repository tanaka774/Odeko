<!--
	Calendar: the current month, today highlighted. Arrows or the mouse wheel
	change the month; click the title to come back to today.
	Recolor with the variables in :root.
-->
<style>
	:root {
		--accent: #60a5fa;
		--muted: rgba(255, 255, 255, 0.45);
		--weekend: #f9a8d4;
	}
	* {
		box-sizing: border-box;
	}
	body {
		display: flex;
		flex-direction: column;
		height: 100vh;
		padding: 8px 10px;
		user-select: none;
	}
	header {
		display: flex;
		align-items: center;
		justify-content: space-between;
		margin-bottom: 4px;
	}
	#title {
		font-weight: 700;
		font-size: 1.1em;
		cursor: pointer;
	}
	header button {
		background: none;
		border: none;
		color: inherit;
		font: inherit;
		font-size: 1.2em;
		opacity: 0.6;
		cursor: pointer;
		padding: 0 6px;
	}
	header button:hover {
		opacity: 1;
	}
	#grid {
		flex: 1;
		display: grid;
		grid-template-columns: repeat(7, 1fr);
		grid-auto-rows: 1fr;
		text-align: center;
		align-items: center;
	}
	.dow {
		font-size: 0.75em;
		color: var(--muted);
		text-transform: uppercase;
		letter-spacing: 0.05em;
	}
	.day {
		font-variant-numeric: tabular-nums;
		border-radius: 999px;
		aspect-ratio: 1;
		max-height: 100%;
		margin: auto;
		display: grid;
		place-items: center;
		min-width: 1.9em;
	}
	.day.weekend {
		color: var(--weekend);
	}
	.day.other {
		color: var(--muted);
		opacity: 0.5;
	}
	.day.today {
		background: var(--accent);
		color: #0b1020;
		font-weight: 700;
	}
</style>
<header>
	<button id="prev" aria-label="Previous month">‹</button>
	<div id="title" title="Back to today"></div>
	<button id="next" aria-label="Next month">›</button>
</header>
<div id="grid"></div>
<script>
	const MONDAY_FIRST = true;
	const grid = document.getElementById('grid');
	let shown = new Date();
	shown.setDate(1);

	function render() {
		const today = new Date();
		const year = shown.getFullYear();
		const month = shown.getMonth();
		document.getElementById('title').textContent = shown.toLocaleDateString(undefined, {
			month: 'long',
			year: 'numeric'
		});
		const names = [];
		for (let i = 0; i < 7; i++) {
			const d = new Date(2024, 0, (MONDAY_FIRST ? 1 : 7) + i);
			names.push(d.toLocaleDateString(undefined, { weekday: 'narrow' }));
		}
		const cells = names.map((n) => `<div class="dow">${n}</div>`);
		const offset = (new Date(year, month, 1).getDay() + (MONDAY_FIRST ? 6 : 0)) % 7;
		const start = new Date(year, month, 1 - offset);
		for (let i = 0; i < 42; i++) {
			const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
			const classes = ['day'];
			if (d.getMonth() !== month) classes.push('other');
			if (d.getDay() === 0 || d.getDay() === 6) classes.push('weekend');
			if (d.toDateString() === today.toDateString()) classes.push('today');
			cells.push(`<div class="${classes.join(' ')}">${d.getDate()}</div>`);
		}
		grid.innerHTML = cells.join('');
	}

	function move(step) {
		shown = new Date(shown.getFullYear(), shown.getMonth() + step, 1);
		render();
	}

	document.getElementById('prev').addEventListener('click', () => move(-1));
	document.getElementById('next').addEventListener('click', () => move(1));
	document.getElementById('title').addEventListener('click', () => {
		shown = new Date();
		shown.setDate(1);
		render();
	});
	window.addEventListener('wheel', (event) => move(event.deltaY > 0 ? 1 : -1), { passive: true });

	render();
	let lastDay = new Date().toDateString();
	setInterval(() => {
		if (new Date().toDateString() !== lastDay) {
			lastDay = new Date().toDateString();
			render();
		}
	}, 60000);
</script>
