<style>
	body { padding: 8px 12px; }
	h3 { margin: 0 0 4px; font-size: 0.75em; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.55; }
	.coin { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
	.coin:last-child { border-bottom: none; }
	.name { font-weight: 600; }
	.price { font-weight: 700; font-variant-numeric: tabular-nums; }
	.chg { font-size: 0.85em; font-variant-numeric: tabular-nums; }
	.up { color: #4ade80; }
	.down { color: #f87171; }
	#updated { font-size: 0.7em; opacity: 0.5; text-align: right; }
	#err { color: #fca5a5; font-size: 0.8em; word-break: break-all; }
</style>
<h3>Crypto</h3>
<div id="list">Loading…</div>
<div id="err"></div>
<div id="updated"></div>
<script>
	// CoinGecko's free tier allows ~10-30 requests a minute, so refresh every 30s.
	const COINS = [
		['bitcoin', 'Bitcoin'],
		['ethereum', 'Ethereum']
	];
	const URL = `https://api.coingecko.com/api/v3/simple/price?ids=${COINS.map(([id]) => id).join(',')}&vs_currencies=usd&include_24hr_change=true`;

	function fmtPrice(n) {
		return n.toFixed(n >= 1000 ? 0 : 2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
	}

	async function load() {
		const err = document.getElementById('err');
		err.textContent = '';
		try {
			const { status, body } = await odeko.fetch(URL);
			if (status !== 200) throw new Error(`HTTP ${status}`);
			const data = JSON.parse(body);
			const list = document.getElementById('list');
			list.replaceChildren(
				...COINS.filter(([id]) => data[id]).map(([id, name]) => {
					const { usd, usd_24h_change: change } = data[id];
					const row = document.createElement('div');
					row.className = 'coin';
					row.innerHTML = `<span class="name"></span><span class="price">$${fmtPrice(usd)}</span><span class="chg ${change >= 0 ? 'up' : 'down'}">${change >= 0 ? '+' : ''}${change.toFixed(2)}%</span>`;
					row.querySelector('.name').textContent = name;
					return row;
				})
			);
			document.getElementById('updated').textContent = `Updated ${new Date().toLocaleTimeString()}`;
		} catch (error) {
			err.textContent = String(error.message ?? error);
		}
	}

	load();
	setInterval(load, 30000);
</script>
