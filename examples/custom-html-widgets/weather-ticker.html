<style>
	body { display: grid; place-content: center; gap: 2px; height: 100vh; text-align: center; }
	#city { font-weight: 600; }
	#temp { font-size: 2.2em; font-weight: 700; }
	#desc, #err { font-size: 0.85em; opacity: 0.7; }
	input { font: inherit; font-size: 0.8em; width: 9em; margin-top: 6px; padding: 2px 6px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.25); background: rgba(0, 0, 0, 0.3); color: inherit; text-align: center; }
</style>
<div id="city">Loading…</div>
<div id="temp"></div>
<div id="desc"></div>
<div id="err"></div>
<input id="pick" aria-label="City" />
<script>
	// The first request to each host asks you to Allow it. The city you type
	// is saved with odeko.storage.
	const CODES = { 0: 'Clear sky', 1: 'Mainly clear', 2: 'Partly cloudy', 3: 'Overcast', 45: 'Fog', 48: 'Rime fog', 51: 'Light drizzle', 61: 'Light rain', 63: 'Rain', 65: 'Heavy rain', 71: 'Snow', 80: 'Showers', 95: 'Thunderstorm' };
	const $ = (id) => document.getElementById(id);

	// One retry: a single dropped connection should not leave the widget stuck.
	async function getJson(url, retries = 1) {
		try {
			const { status, body } = await odeko.fetch(url);
			if (status !== 200) throw new Error(`HTTP ${status}`);
			return JSON.parse(body);
		} catch (error) {
			if (retries === 0 || String(error).includes('denied')) throw error;
			await new Promise((resolve) => setTimeout(resolve, 1500));
			return getJson(url, retries - 1);
		}
	}

	async function load(city) {
		$('err').textContent = '';
		try {
			const geo = await getJson(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1`);
			const place = geo.results && geo.results[0];
			if (!place) throw new Error(`${city} not found`);
			const weather = await getJson(`https://api.open-meteo.com/v1/forecast?latitude=${place.latitude}&longitude=${place.longitude}&current=temperature_2m,weather_code`);
			$('city').textContent = place.name;
			$('temp').textContent = `${Math.round(weather.current.temperature_2m)}°C`;
			$('desc').textContent = CODES[weather.current.weather_code] ?? `Code ${weather.current.weather_code}`;
		} catch (error) {
			if ($('city').textContent === 'Loading…') $('city').textContent = city;
			$('err').textContent = String(error.message ?? error);
		}
	}

	$('pick').addEventListener('change', (event) => {
		const city = event.target.value.trim();
		if (!city) return;
		odeko.storage.set('city', city);
		load(city);
	});

	(async () => {
		const city = (await odeko.storage.get('city')) ?? 'Tokyo';
		$('pick').value = city;
		load(city);
		setInterval(() => load($('pick').value || city), 30 * 60 * 1000);
	})();
</script>
